name: Build module release

# Builds the Magisk/KernelSU module from a clean runner and attaches the ZIP
# to a GitHub Release when a release tag (e.g. v1.102.4-module.1) is pushed.
# Manual runs (workflow_dispatch) build the version pinned in
# TAILSCALE_VERSION and upload the ZIP as a workflow artifact instead.
#
# Requires no repository secrets: GITHUB_TOKEN is sufficient to create the
# release and upload the artifact.

on:
  push:
    tags:
      - "v*-module.*"
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream Tailscale tag to build (defaults to TAILSCALE_VERSION file)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module repository
        uses: actions/checkout@v4

      - name: Determine upstream version
        run: |
          set -euo pipefail
          PINNED="$(tr -d '[:space:]' < TAILSCALE_VERSION)"
          if [ -n "${{ inputs.upstream_version }}" ]; then
            UPSTREAM="${{ inputs.upstream_version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # v1.102.4-module.1 -> v1.102.4
            UPSTREAM="${GITHUB_REF_NAME%%-module*}"
          else
            UPSTREAM="${PINNED}"
          fi
          echo "Pinned version : ${PINNED}"
          echo "Upstream tag   : ${UPSTREAM}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${UPSTREAM}" != "${PINNED}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match pinned upstream ${PINNED} (TAILSCALE_VERSION). Refusing to build a mismatched release."
            exit 1
          fi
          echo "TAILSCALE_VERSION=${UPSTREAM}" >> "$GITHUB_ENV"
          echo "MODULE_VERSION=${UPSTREAM}-module.1" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Locate Android NDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "${NDK_DIR}" ]; then
              echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build module ZIP
        run: ./build.sh "${TAILSCALE_VERSION}"
        env:
          MODULE_VERSION: ${{ env.MODULE_VERSION }}

      - name: Checksum
        run: |
          sha256sum "dist/Magisk-Tailscaled-${MODULE_VERSION}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Magisk-Tailscaled-${{ env.MODULE_VERSION }}"
          path: "dist/Magisk-Tailscaled-${{ env.MODULE_VERSION }}.zip"
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > release_notes.md <<'EOF'
          ## Unofficial Magisk/KernelSU module build

          > **This is an unofficial community packaging of Tailscale for rooted
          > Android (Magisk / KernelSU). It is not an official Tailscale release.**

          - **Upstream Tailscale version:** TAILSCALE_VERSION_PLACEHOLDER
          - **Android-specific patches:** applied (`android.ssh.patch`) — enables
            `tailscaled` and Tailscale SSH on rooted Android (root user lookup,
            `/system/bin/sh`, `/data/ssh/root` home, Android-safe socket paths)
          - **Architecture:** arm64 (aarch64) only
          - Install via Magisk app → Modules → Install from storage, then reboot.
          EOF
          sed -i "s/TAILSCALE_VERSION_PLACEHOLDER/${TAILSCALE_VERSION}/" release_notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release_notes.md \
            "dist/Magisk-Tailscaled-${MODULE_VERSION}.zip"

      - name: Sync update.json to default branch (best effort)
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > update.json <<EOF
          {
            "version": "${MODULE_VERSION}",
            "versionCode": "$(echo "${MODULE_VERSION}" | tr -dc '0-9')",
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Magisk-Tailscaled-${MODULE_VERSION}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --staged --quiet; then
            echo "update.json already up to date"
          else
            git commit -m "Release ${MODULE_VERSION}"
            git push origin HEAD:main
          fi
